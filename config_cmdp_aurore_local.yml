## Synthetic population pipeline for Île-de-France
## based on the synpp package

# This is the path to a directory where the pipeline can store temporary data
working_directory: /home/asallard/Documents/Tests/caches/cache_geneva

# This section defines which parts of the pipeline should be run
run:
  # - data.spatial.municipality_types
  #- data.hts.edgt_74.adisp_merge.merge
  # - synthesis.population.cross_perimeter
  - synthesis.output
  #- synthesis.population.sampled
  - analysis.debug.commute_flows
  - analysis.debug.commute_flows_census
  # - analysis.reference.hts.chains
  # - synthesis.population.trips_boat
  # - data.gtfs.output
  # - data.ban.raw
  # - data.bdtopo.raw
  # - data.ban.raw

# Here the configuraiton of the pipeline starts
config:

  ##############################
  # Some general configuration #
  ##############################
  
  ## Number of CPUs to use
  processes: 4

  ################
  # Random seeds #
  ################
  
  ## global random seed for the output population
  random_seed: 31415

  ## bpe specific random seed when impute missing coordinates for known IRIS
  # bpe_random_seed: 0
  
  ##################################################
  # Define sampling rate for the output population #
  ##################################################
  
  sampling_rate: 1.0

  #################################
  # household travel survey (HTS) #
  #################################

  ## Define whether to use ENTD or EGT as the HTS
  hts: edgt_74 # entd, egt, edgt_lyon, edgt_44
  edgt74_version: adisp # adisp (default) or tpg. 

  ## Whether to filter people going outside of the area and other filters
  filter_hts: false

  ## if selected, chose the source for edgt_lyon
  # edgt_lyon_source: unchosen # unchosen, adisp, cerema

  ##################
  # Zone selection #
  ##################

  ## select regions by region_id
  regions: ["84"]
  
  ## select departments by department_id
  departments: ["74", "01"]

  ##################
  # Day selection  #
  ##################
  specific_day_scenario: workday # default = workday. Otherwise weekend or any day or list of day like monday or ["thursday", "friday"] is admissible
  # might affect which HTS is used: if edgt_74 is chosen but a weekend scenario is selected here, the HTS will default to ENTD as EDGT did not interview
  # people in the weekend

    
  #######################
  #     Output paths    #
  #######################
  
  ## output folder
  output_path: /home/asallard/Documents/Tests/outputs/output_geneva/

  ## output prefix, appended to file names
  output_prefix: cmdp_

  ## file formats that should be exported
  # output_formats: ["csv", "gpkg"] # ["csv", "gpkg", "parquet", "geoparquet"]

  ##############################
  #  Algorithms configurations #
  ##############################

  ## Use the bhepop2 package for attributing income
  # income_assignation_method: bhepop2 # uniform, bhepop2

  ## Activate if you want to run mode choice, will assign a mode to output trips
  mode_choice: false

  ## Statistical matching configuration
 
  ## Minimum number of observation to sample from
  # matching_minimum_observations: 20

  ## list of attributes to use for matching
  # matching_attributes: ["sex", "any_cars", "age_class", "socioprofessional_class", "departement_id"]
  ## canton_id: census canton-ou-ville (CANTVILLE), HTS home zone canton (edgt_74 only);
  ## optional; socioprofessional_class is left out (never reached after the work /
  ## education attributes, see synthesis.population.matched)
  ## sex is optional: it comes after the work / education attributes, so that cells
  ## stay large enough to match on the usual commute mode
  matching_attributes: ["age_class", "any_cars", "sex", "canton_id"]
  mandatory_matching_attributes: ["age_class", "any_cars"]

  ## Use INSEE's urban type in statistical matching
  # use_urban_type: true
  # urban_type_path: urban_type/UU2020_au_01-01-2023.zip
  # matching_attributes: ["urban_type", "*default*"]
  
  ## Exclude entreprise without any employee (trancheEffectifsEtablissement is NA, "NN" or "00")
  # exclude_no_employee: true

  ## source for the education locations
  # education_location_source: bpe # bpe, addresses

  ## max iterations for the secondary location selection algorithm
  # secloc_maximum_iterations: np.inf

  ## Buffer arround buildings to capture adresses in their vicinity
  # home_address_buffer: 5.0

  ## How sample homes, using weights or not
  # home_location_weight: housing # "uniform", "housing"
  
  # home_location_source: addresses # "addresses", "buildings", "tiles"

  ## How to place households whose census commune is unknown (only the departement is):
  ## "population" (by commune population) or "ilt" (also by the MOBPRO place of work
  ## and commute mode of their members, see synthesis.population.spatial.home.zones)
  home_zone_method: ilt # "population", "ilt"

  ## Restrict those households to the communes of their census canton (CANTVILLE)
  ## instead of the whole departement (canton codes: data.spatial.canton_codes)
  home_zone_use_cantons: true

  ## When work places are assigned: "after_matching" (by home commune, to agents whose
  ## matched HTS chain has a work trip) or "before_matching" (to every census-employed
  ## agent, by home commune, commute mode and census place of work; matching then also
  ## uses employment (full / part-time) and cross-border workplace (mandatory), distance
  ## class and usual commute mode, see
  ## synthesis.population.spatial.primary.work_first; needs hts: edgt_74)
  work_location_method: before_matching # "after_matching", "before_matching"

  ## Same for places of study: "before_matching" assigns one to every census student
  ## (by home commune, age range and census place of study, MOBSCO) and matches on the
  ## home-place of study distance class, see synthesis.population.spatial.primary.education_first
  education_location_method: before_matching # "after_matching", "before_matching"
  # canton_codes_path: communes_2023/communes-france-2023.csv

  ## When running matsim

  ## performing one run of the matsim simulation or not
  # run_matsim: true

  ## creating the far or not
  # write_jar: true

  ## Cutter settings: Used to define a specific area for analysis or simulation
  # cutter:
  
    ## Path to the directory containing the cutter geojson file
    # path: cutter
    
    ## Name of the cutter file (e.g., GeoJSON file defining the area)
    # file: cutter.geojson
    
    ## Name of the cutter (used for output file naming)
    # name: paris
    
    ## Whether to apply the cutter after the full simulation (True/False)
    # after_full_simulation: True

  ## NoiseModelling settings: Configuration for noise exposure or noise map generation
  # noise:

    ## Type of noise computation to perform ("exposure" for exposure analysis, "maps" for noise maps)
    # compute: exposure

    ## Size of the time bins for noise computation, in seconds (e.g., 3600 for hourly bins)
    # time_bin_size: 3600
    
    ## Start time for noise computation, in seconds (e.g., 0 for midnight)
    # time_bin_min: 0
    
    ## End time for noise computation, in seconds (e.g., 86400 for 24 hours)
    # time_bin_max: 86400

    ## Maximum order of reflections to consider (e.g., 1 for first-order reflections)
    # refl_order: 1

    ## Maximum distance for considering noise sources, in meters
    # max_src_dist: 750

    ## Maximum distance for considering reflections, in meters
    # max_refl_dist: 50

  ############################
  #  Analysis configuration  #
  ############################

  ## Whether to use previously generated files or not
  # analysis_from_file: false

  ## prefix of the files to compare to
  # comparison_file_prefix: other_

  ##########################
  #  Tools configuration   #
  ##########################

  ## Mostly interesting if you run the simulation, or you activate the `mode_choice` option,

  ## Binaries paths  
  # git_binary: git
  # java_binary: java
  # maven_binary: mvn
  # maven_local_cache: false

  ## Binaries parameters
  # java_memory: 14G
  # maven_skip_tests: false
  
  ## eqasim-java parameters
  eqasim_version: 1.5.0
  eqasim_branch: develop
  eqasim_commit: ece4932
  eqasim_repository: https://github.com/eqasim-org/eqasim-java.git
  #eqasim_path: ""

  ## pt2matsim parameters
  pt2matsim_version: 22.3
  pt2matsim_branch: v22.3

  ## Strategy to use in pt2matsim gtfs processing
  # gtfs_date: dayWithMostServices

  ## Export the detailed geometry of the network before simplification in pt2matsim
  # export_detailed_network: true

  #################
  #  Input paths  #
  #################

  ## Absolute root path of all input data
  data_path: /home/asallard/Euler_data/fr_data

  # census_path: rp_2019/RP2019_INDCVI_csv.zip
  # census_csv: FD_INDCVI_2019.csv
  ## Census 2023 (individuals, MOBPRO and MOBSCO all from the same release)
  census_path: rp_2023/RP2023_indcvi.parquet

  ban_path: ban_cmdp

  bdtopo_path: bdtopo_cmdp

  # bpe_path: bpe_2021/bpe21_ensemble_xy_csv.zip
  # bpe_csv: bpe21_ensemble_xy.csv

  #gtfs_path: gtfs_cmdp
  gtfs_files: ["/home/asallard/Documents/Data/pipeline/gtfs/merged_gtfs.zip"]

  ##############################
  # SEND PEOPLE TO SWITZERLAND #
  ##############################
  generate_outbound_flows: true
  swiss_cantons: "/home/asallard/Euler_data/ch_data/pipeline/spatial/canton/swissBOUNDARIES3D_1_5_TLM_KANTONSGEBIET.shp"
  swiss_municipalities: "/home/asallard/Euler_data/ch_data/pipeline/spatial/municipality/2022/swissBOUNDARIES3D_1_5_TLM_HOHEITSGEBIET.shp"
  cantons: ["Genève", "Vaud"]
  swiss_municipality_types: "/home/asallard/Euler_data/ch_data/pipeline/spatial/Raumgliederungen.xlsx"

  # Thonon <-> Lausanne/Nyon boat commute mode (data.od.thonon_boat_zones),
  # reassigns a modelled share of car/pt Thonon work commuters to "boat".
  # thonon_boat_travel_times_path: cross_border/thonon_boat_travel_times.csv
  # recompute_thonon_boat_advantage: false

  # income_com_path: filosofi_2019/indic-struct-distrib-revenu-2019-COMMUNES.zip
  # income_com_xlsx: FILO2019_DISP_COM.xlsx
  # income_reg_path: filosofi_2019/indic-struct-distrib-revenu-2019-SUPRA.zip
  # income_reg_xlsx: FILO2019_DISP_REG.xlsx
  # income_year: 19
  
  # tiles_path: tiles_2019/Filosofi2019_carreaux_200m_gpkg.zip
  # tiles_file: carreaux_200m_met.gpkg

  # od_pro_path: rp_2019/RP2019_MOBPRO_csv.zip
  ## MOBPRO and MOBSCO of the same year as the census (census_path)
  od_pro_path: rp_2023/RP2023_mobpro.parquet
  # od_sco_path: rp_2019/RP2019_MOBSCO_csv.zip
  od_sco_path: rp_2023/RP2023_mobsco.parquet
  ## The Swiss destination codes (SU...) of the 2023 files are all covered by the 2022 documentation
  # od_documentation_path: rp_2022/contenu_RP2022_mobpro.pdf
  ## MOBPRO 2023 for analysis.debug.mode_shares (its default still points to rp_2022/)
  od_pro_2023_path: rp_2023/RP2023_mobpro.parquet
  # od_pro_csv: FD_MOBPRO_2019.csv
  # od_sco_csv: FD_MOBSCO_2019.csv
  
  ## external education locations file
  # education_file: education/education_addresses.geojson

  osm_path: osm_cmdp

  # siren_path: sirene/StockUniteLegale_utf8.zip
  # siret_path: sirene/StockEtablissement_utf8.zip
  # siret_geo_path: sirene/GeolocalisationEtablissement_Sirene_pour_etudes_statistiques_utf8.zip

  # iris_path: iris_2021
  ## 2025 geography, the one of the 2023 census
  iris_path: iris_2025
  codes_path: codes_2025/reference_IRIS_geo2025.zip
  codes_xlsx: reference_IRIS_geo2025.xlsx

  # population_path: rp_2019/base-ic-evol-struct-pop-2019.zip
  # population_xlsx: base-ic-evol-struct-pop-2019.xlsx
  # population_year: 19
  ## IRIS population of the 2023 census (INSEE Melodi DS_RP_POPULATION_PRINC_IRIS, parquet;
  ## population_csv / population_year only apply to the older base-ic CSV files)
  population_path: rp_2023/DS_RP_POPULATION_PRINC_IRIS_2023.parquet

  ## population projections
  # projection_path: projection_2021
  # projection_scenario: 00_central
  # projection_year: 2030

  # vehicles_method: default # fleet_sample, default
  # vehicles_path: vehicles
  # vehicles_year: 2021
